<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Падающие сердечки */
        .falling-heart {
            position: fixed;
            font-size: 20px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Основной контейнер */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Заголовок */
        .title {
            font-size: 48px;
            color: #ff6b9d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
            text-align: center;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Динозавр */
        .dino-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px 0;
        }

        .dino {
            font-size: 120px;
            position: absolute;
            animation: bounce 1s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .dino:hover {
            transform: scale(1.2) rotate(10deg);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .dino-heart {
            position: absolute;
            font-size: 40px;
            animation: float-heart 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float-heart {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(50px, -100px) scale(0);
                opacity: 0;
            }
        }

        /* Кнопки комплиментов */
        .compliments-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.3);
            margin: 30px 0;
            text-align: center;
            max-width: 600px;
        }

        .compliment-text {
            font-size: 28px;
            color: #ff6b9d;
            margin-bottom: 30px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }

        .magic-btn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
            font-weight: bold;
        }

        .magic-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.6);
        }

        .magic-btn:active {
            transform: translateY(0);
        }

        /* Секретное сообщение */
        .secret-message {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.3);
            margin: 30px 0;
            text-align: center;
            max-width: 700px;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s;
        }

        .secret-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .secret-message h2 {
            font-size: 36px;
            color: #ff6b9d;
            margin-bottom: 20px;
        }

        .secret-message p {
            font-size: 22px;
            color: #333;
            line-height: 1.8;
            margin: 15px 0;
        }

        /* Анимация взрыва сердечек */
        .heart-explosion {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            animation: explode 1.5s ease-out forwards;
            z-index: 100;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .title {
                font-size: 32px;
            }
            .dino {
                font-size: 80px;
            }
            .compliment-text {
                font-size: 22px;
            }
            .secret-message h2 {
                font-size: 28px;
            }
            .secret-message p {
                font-size: 18px;
            }
        }

        /* Плавающие элементы */
        .floating-element {
            position: fixed;
            font-size: 40px;
            opacity: 0.3;
            animation: float-around 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float-around {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(100vw, 100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Падающие сердечки будут добавляться через JavaScript -->

    <!-- Плавающие элементы фона -->
    <div class="floating-element" style="top: 10%; left: 10%; animation-duration: 25s;">💕</div>
    <div class="floating-element" style="top: 20%; right: 15%; animation-duration: 30s;">💖</div>
    <div class="floating-element" style="top: 60%; left: 5%; animation-duration: 28s;">💗</div>
    <div class="floating-element" style="top: 70%; right: 10%; animation-duration: 32s;">💝</div>

    <div class="container">
        <h1 class="title">Привет 🤙🤙! ☀️</h1>

        <div class="dino-container" id="dinoContainer">
            <div class="dino" id="dino">🦖</div>
        </div>

        <div class="compliments-section">
            <div class="compliment-text" id="complimentText">
                Нажми на кнопку и получи комплимент! 💝
            </div>
            <button class="magic-btn" onclick="showCompliment()">
                ✨ Магия комплимента ✨
            </button>
        </div>

        <button class="magic-btn" onclick="showSecretMessage()" style="margin-top: 20px;">
            🎁 Открыть сюрприз 🎁
        </button>

        <div class="secret-message" id="secretMessage">
            <h2> связб 💖</h2>
            <p>вась</p>
            <p>рукапопа ☀️</p>
            <p>пчелка🌸</p>
            <p style="font-size: 28px; margin-top: 30px;">че я сделал ваще 🥰</p>
        </div>
    </div>

    <script>
        // Комплименты
        const compliments = [
            "Ты прекрасна, как бегемот! 🌅",
            "Твоя улыбка - мое любимое моя заслуга 🎨",
            "Я тебя могну! ",
            "Ты - мое невезение! 🌟",
            "С тобой каждый день особенно плох! 🌈",
            "Ты невероятно сигма! 💖",

        ];

        let currentCompliment = -1;

        // Показать комплимент
        function showCompliment() {
            const textElement = document.getElementById('complimentText');
            
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * compliments.length);
            } while (newIndex === currentCompliment);
            
            currentCompliment = newIndex;
            
            textElement.style.opacity = '0';
            textElement.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                textElement.textContent = compliments[currentCompliment];
                textElement.style.transition = 'all 0.5s';
                textElement.style.opacity = '1';
                textElement.style.transform = 'translateY(0)';
            }, 300);

            createHeartExplosion();
        }

        // Показать секретное сообщение
        function showSecretMessage() {
            const message = document.getElementById('secretMessage');
            message.classList.add('show');
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createHeartExplosion();
                }, i * 100);
            }
        }

        // Создание взрыва сердечек
        function createHeartExplosion() {
            const hearts = ['❤️', '💖', '💕', '💗', '💝', '💓', '💞'];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-explosion';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                
                const angle = (Math.PI * 2 * i) / 15;
                const distance = 200 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                heart.style.left = centerX + 'px';
                heart.style.top = centerY + 'px';
                heart.style.setProperty('--tx', tx + 'px');
                heart.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 1500);
            }
        }

        // Клик по динозавру
        document.getElementById('dino').addEventListener('click', function(e) {
            const heart = document.createElement('div');
            heart.className = 'dino-heart';
            heart.textContent = '❤️';
            heart.style.left = '100px';
            heart.style.top = '50px';
            document.getElementById('dinoContainer').appendChild(heart);
            
            setTimeout(() => heart.remove(), 2000);

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const miniHeart = document.createElement('div');
                    miniHeart.className = 'heart-explosion';
                    miniHeart.textContent = '💕';
                    miniHeart.style.left = e.clientX + 'px';
                    miniHeart.style.top = e.clientY + 'px';
                    
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 100 + Math.random() * 50;
                    miniHeart.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                    miniHeart.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                    
                    document.body.appendChild(miniHeart);
                    setTimeout(() => miniHeart.remove(), 1500);
                }, i * 50);
            }
        });

        // Падающие сердечки
        function createFallingHeart() {
            const hearts = ['❤️', '💖', '💕', '💗', '💝'];
            const heart = document.createElement('div');
            heart.className = 'falling-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 8000);
        }

        setInterval(createFallingHeart, 500);

        for (let i = 0; i < 10; i++) {
            setTimeout(createFallingHeart, i * 200);
        }
    </script>
</body>
</html>
